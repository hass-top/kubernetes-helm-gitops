
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: challenge-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hass-top/kubernetes-helm-gitops.git
    targetRevision: main
    path: challenge-app
    helm:
      releaseName: challenge-app
  destination:
    server: https://kubernetes.default.svc
    namespace: challenge-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
